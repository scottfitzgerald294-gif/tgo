[tool.poetry]
name = "pdd-customer-service"
version = "0.1.0"
description = "Independent PDD customer service connector extension for TGO"
authors = ["PDD Customer Service Team"]
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
fastapi = "^0.115.0"
uvicorn = { version = "^0.32.0", extras = ["standard"] }
pydantic = "^2.9.0"

[tool.poetry.group.dev.dependencies]
bandit = ">=1.8,<2.0"
httpx = ">=0.28,<1.0"
mypy = ">=1.13,<2.0"
pip-audit = ">=2.7,<3.0"
pytest = ">=8.0,<9.0"
ruff = ">=0.9,<1.0"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-config", "--strict-markers"]
testpaths = ["tests"]
markers = [
    "unit: isolated tests without network or infrastructure",
    "integration: in-process component tests using fakes",
    "contract: approved external contract tests",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
